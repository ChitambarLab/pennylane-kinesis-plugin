
[metadata]
name = pennylane-kinesis
version = 0.1.0
author = Brian Doolittle and Colin Lualdi
author_email = brian.d.doolittle@gmail.com
description = Pennylane plugin integrating the Thorlabs Kinesis software. 
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ChitambarLab/pennylane-kinesis-plugin
project_urls =
    Bug Tracker = https://github.com/ChitambarLab/pennylane-kinesis-plugin
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    pennylane==0.29.1

[options.packages.find]
where = src

[options.entry_points]
pennylane.plugins =
    kinesis.simulator = pennylane_kinesis:KinesisSimulatorDevice
    kinesis.cage.rotator = pennylane_kinesis:KinesisCageRotatorDevice

