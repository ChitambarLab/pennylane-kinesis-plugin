
[metadata]
name = pennylane-kinesis
version = 0.1.0
author = Brian Doolittle
author_email = brian.d.doolittle@gmail.com
description = Pennylane plugin integrating the Thorlabs Kinesis software. 
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ChitambarLab/pennylane-kinesis
project_urls =
    Bug Tracker = https://github.com/ChitambarLab/pennylane-kinesis
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3
install_requires =
    pennylane==0.27

[options.packages.find]
where = src

[options.entry_points]
pennylane.plugins =
    kinesis.simulator = pennylane_kinesis.KinesisSimulatorDevice

