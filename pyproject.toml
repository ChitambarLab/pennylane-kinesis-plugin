[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pennylane-kinesis-plugin"
description = "Pennylane plugin integrating the Thorlabs Kinesis software."
readme = "README.md"
authors = [
  {name = "Brian Doolittle", email = "brian.d.doolittle@gmail.com"},
  {name = "Michael Vayninger"},
  {name = "Timur Javid"},
  {name = "Colin Lualdi"}
]
maintainers = [
  {name = "Brian Doolittle", email = "brian.d.doolittle@gmail.com"}
]
requires-python = ">=3.8"
dynamic = ["dependencies", "version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]

[project.urls]
source = "https://github.com/ChitambarLab/pennylane-kinesis-plugin"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {file = "version.txt"}

[tool.setuptools.packages.find]
where = ["src/"]
include = ["pennylane_kinesis*"]
namespaces = false

[project.entry-points."pennylane.plugins"]
"kinesis.simulator" = "pennylane_kinesis:KinesisSimulatorDevice"
"kinesis.cage.rotator" = "pennylane_kinesis:KinesisCageRotatorDevice"




